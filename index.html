<style>
:root{--primary:#8BC34A;--primary-dark:#689F38;--primary-light:#DCEDC8;--primary-rgb:139,195,74;--accent:#FF9800;--danger:#F44336;--success:#4CAF50;--text-primary:#1B1B1F;--text-secondary:#49454F;--text-tertiary:#7A757F;--bg-base:#FAFDF6;--bg-surface:#FFF;--bg-card:#FFF;--bg-hover:#F1F4EC;--border:#E0E4DB;--divider:#EAEEE3;--bg-overlay:rgba(0,0,0,.5);--shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 2px 8px rgba(0,0,0,.1);--shadow-fab:0 4px 14px rgba(var(--primary-rgb),.45);--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;--radius-full:9999px;--font-xs:11px;--font-sm:13px;--font-base:15px;--font-md:17px;--font-lg:20px;--font-xl:24px;--font-2xl:30px;--font-3xl:38px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--header-h:52px;--tabbar-h:62px;--gesture-nav-h:20px;--bottom-nav-h:calc(var(--tabbar-h) + var(--safe-bottom) + var(--gesture-nav-h));--content-bottom-pad:calc(var(--bottom-nav-h) + 16px)}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.5;overflow-x:hidden;font-size:var(--font-base);padding:var(--safe-top) 0 var(--safe-bottom);overscroll-behavior-y:none;-webkit-overflow-scrolling:touch}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top-nav{position:sticky;top:var(--safe-top);z-index:100;height:var(--header-h);display:flex;align-items:center;padding:0 12px;background:var(--bg-surface);border-bottom:1px solid var(--divider);box-shadow:var(--shadow-sm);gap:8px}
.nav-back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-primary);border-radius:var(--radius-full);cursor:pointer;flex-shrink:0;font-size:24px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:var(--bottom-nav-h);display:flex;align-items:flex-start;padding-top:6px;padding-bottom:calc(var(--safe-bottom) + var(--gesture-nav-h));background:var(--bg-surface);border-top:1px solid var(--divider);box-shadow:0 -2px 10px rgba(0,0,0,.05);max-width:560px;margin:0 auto}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;color:var(--text-tertiary);cursor:pointer;padding:4px 0;font-size:var(--font-xs);font-family:inherit}

.fab-circle{width:54px;height:54px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:var(--shadow-fab);margin-top:-22px;border:3px solid var(--bg-surface);transition:transform .2s}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.qm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.qm-item:active{transform:scale(.94)}
.qm-icon{width:46px;height:46px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:23px}

.card{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--divider)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:var(--font-md);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:11px 22px;min-height:44px;border:none;border-radius:var(--radius-full);font-size:var(--font-base);font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-dark);transform:scale(.97)}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:6px 14px;min-height:32px;font-size:var(--font-sm)}
.input,.select,.textarea{width:100%;padding:11px 14px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-base);font-family:inherit}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(var(--primary-rgb),.25)}
.textarea{resize:vertical;min-height:76px}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:var(--radius-full);background:var(--primary-light);color:var(--primary-dark);font-size:var(--font-xs);font-weight:500;cursor:pointer;border:1px solid transparent}
.chip.active{background:var(--primary);color:#fff}
.chip-outline{background:transparent;border-color:var(--border);color:var(--text-secondary)}
.progress-bar{width:100%;height:8px;background:var(--bg-hover);border-radius:var(--radius-full);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:var(--radius-full);transition:width .4s}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--divider)}
.list-item:last-child{border-bottom:none}
.checkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.checkbox.checked{background:var(--primary);border-color:var(--primary)}
.checkbox.checked::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.empty-state{text-align:center;padding:28px 14px;color:var(--text-tertiary)}
.empty-icon{font-size:44px;margin-bottom:8px;opacity:.5}
.empty-text{font-size:var(--font-sm)}
.toast{position:fixed;bottom:calc(var(--bottom-nav-h) + 20px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,.85);color:#fff;padding:11px 22px;border-radius:var(--radius-full);font-size:var(--font-sm);z-index:9999;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.modal-overlay{position:fixed;inset:0;background:var(--bg-overlay);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:var(--bg-surface);border-radius:var(--radius-lg);padding:20px;animation:modalIn .25s}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:var(--font-lg);font-weight:700;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.segmented{display:flex;background:var(--bg-hover);border-radius:var(--radius-full);padding:3px;margin-bottom:12px;gap:2px}
.seg-item{flex:1;padding:8px 6px;text-align:center;font-size:var(--font-sm);font-weight:500;color:var(--text-secondary);border:none;background:transparent;border-radius:var(--radius-full);cursor:pointer;white-space:nowrap;font-family:inherit}
.seg-item.active{background:var(--bg-surface);color:var(--primary-dark);font-weight:600;box-shadow:var(--shadow-sm)}
.coin-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;background:linear-gradient(135deg,#FFD700,#FFA000);color:#fff;border-radius:var(--radius-full);font-size:var(--font-sm);font-weight:700}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--bg-hover);border-radius:var(--radius-full);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--primary);border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:var(--shadow-sm)}
.theme-swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px}
.color-swatch{width:38px;height:38px;border-radius:var(--radius-full);cursor:pointer;border:3px solid transparent}
.color-swatch.active{border-color:var(--text-primary);transform:scale(1.1)}
.link{color:var(--primary-dark);cursor:pointer;text-decoration:underline}
.guide-step{background:var(--bg-hover);border-radius:var(--radius-md);padding:12px;margin-bottom:10px}
.guide-step h4{color:var(--primary-dark);margin-bottom:6px;font-size:var(--font-base)}
.guide-step p,.guide-step li{font-size:var(--font-sm);color:var(--text-secondary);line-height:1.7}
.guide-step code{background:var(--bg-surface);padding:2px 6px;border-radius:4px;font-size:var(--font-xs);color:var(--primary-dark);word-break:break-all}
.sql-box{width:100%;font-family:monospace;font-size:12px;background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:8px;border:none;min-height:120px;color-scheme:dark}
.sync-status{display:inline-flex;align-items:center;gap:5px;font-size:var(--font-xs);padding:3px 10px;border-radius:var(--radius-full);background:var(--bg-hover);color:var(--text-secondary)}
::-webkit-scrollbar{width:0;height:0}
@media(min-width:768px){.main-content{max-width:520px;padding-top:20px}.bottom-nav{max-width:520px;left:50%;transform:translateX(-50%)}}
</style>

<body>
<div id="app"><div class="empty-state" style="padding:80px 20px"><div class="empty-icon">⏳</div><div class="empty-text">正在加载工作台...</div></div></div>
<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const getToday=()=>{const d=new Date(),o=d.getTimezoneOffset()*6e4;return new Date(d-o).toISOString().slice(0,10)};
const getNow=()=>new Date().toISOString();
const WD=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const wdCN=d=>WD[new Date(d).getDay()];
function fmt(d,f='YYYY-MM-DD'){d=new Date(d);const o=d.getTimezoneOffset()*6e4,l=new Date(d-o);const m={YYYY:l.getFullYear(),MM:String(l.getMonth()+1).padStart(2,'0'),DD:String(l.getDate()).padStart(2,'0'),HH:String(l.getHours()).padStart(2,'0'),mm:String(l.getMinutes()).padStart(2,'0')};return f.replace(/YYYY|MM|DD|HH|mm/g,x=>m[x])}
const weekRange=()=>{const t=new Date(),d=t.getDay()||7,m=new Date(t);m.setDate(t.getDate()-d+1);const s=new Date(m);s.setDate(m.getDate()+6);return{start:fmt(m),end:fmt(s)}};
const monthRange=()=>{const t=new Date();return{start:fmt(new Date(t.getFullYear(),t.getMonth(),1)),end:fmt(new Date(t.getFullYear(),t.getMonth()+1,0))}};
const yearRange=y=>({start:`${y}-01-01`,end:`${y}-12-31`});
function toast(msg,d=2200){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},d)}
function modal(title,body,actions=[]){const ov=document.createElement('div');ov.className='modal-overlay active';const m=document.createElement('div');m.className='modal';m.innerHTML=`<h3 class="modal-title">${title}</h3><div class="modal-body">${body}</div><div class="modal-actions">${actions.length?actions.map((a,i)=>`<button class="btn ${a.class||'btn-outline'}" data-i="${i}">${a.label}</button>`).join(''):'<button class="btn btn-primary" data-close>关闭</button>'}</div>`;ov.appendChild(m);document.body.appendChild(ov);m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>ov.remove());m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const a=actions[+b.dataset.i];ov.remove();a.onClick&&a.onClick(m)});ov.onclick=e=>{if(e.target===ov)ov.remove()};return m}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ================= IndexedDB 底层 ================= */
const STORES={tasks:['date','type'],reviews:['date'],inspirations:['createdAt'],english:['type','date'],sidejob_news:['category'],novel_anniversaries:['date'],news:['category','date'],accounting:['date','type'],schedules:['type','date'],coins:['date','type'],wishes:[],checkins:['date','skill'],exercises:['date'],body_data:['date'],temperature:['date'],kitchen:['category'],short_stories:['date'],feed_cache:['mode','date'],settings:['key'],sync_queue:['ts'],meta:['key']};
let _db=null;
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open('WorkbenchDB',2);r.onerror=()=>rej(r.error);r.onsuccess=()=>{_db=r.result;res(_db)};r.onupgradeneeded=e=>{const db=e.target.result;for(const[n,idx]of Object.entries(STORES)){if(!db.objectStoreNames.contains(n)){const s=db.createObjectStore(n,{keyPath:n==='settings'||n==='meta'?'key':'id'});(idx||[]).forEach(i=>s.createIndex(i,i,{unique:false}))}}}})}
const tx=(s,m='readonly')=>openDB().then(db=>db.transaction(s,m).objectStore(s));
const idbPut=(s,d)=>tx(s,'readwrite').then(st=>new Promise((res,rej)=>{const r=st.put(d);r.onsuccess=()=>res(d);r.onerror=()=>rej(r.error)}));
const idbGet=(s,k)=>tx(s).then(st=>new Promise((res,rej)=>{const r=st.get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const idbAll=s=>tx(s).then(st=>new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}));
const idbIdx=(s,i,v)=>tx(s).then(st=>new Promise((res,rej)=>{const r=st.index(i).getAll(v);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}));
const idbRange=(s,i,lo,hi)=>tx(s).then(st=>new Promise((res,rej)=>{const r=st.index(i).getAll(IDBKeyRange.bound(lo,hi));r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}));
const idbDel=(s,k)=>tx(s,'readwrite').then(st=>new Promise((res,rej)=>{const r=st.delete(k);r.onsuccess=()=>res(1);r.onerror=()=>rej(r.error)}));

/* ================= DB 封装（自动进同步队列）================= */
const DB={
  async put(s,d){if(!d.updated_at)d.updated_at=getNow();await idbPut(s,d);if(s!=='sync_queue'&&s!=='meta'){const k=s==='settings'?d.key:d.id;if(k!=null)await Sync.mark(s,k,'put')}return d},
  async delete(s,id){await idbDel(s,id);if(s!=='sync_queue'&&s!=='meta')await Sync.mark(s,id,'delete')},
  get:idbGet,getAll:idbAll,getByIndex:idbIdx,getByRange:idbRange
};
const Settings={async get(k,v=null){const r=await idbGet('settings',k);return r?r.value:v},async set(k,v){await DB.put('settings',{key:k,value:v,updated_at:getNow()})}};
const Meta={async get(k,v=null){const r=await idbGet('meta',k);return r?r.value:v},async set(k,v){await idbPut('meta',{key:k,value:v})}};

/* ================= 云同步引擎（Supabase）================= */
const Sync={
  client:null,user:null,status:'未配置',_t:null,
  async init(){
    const cfg=await Meta.get('supabase',{});
    if(cfg.url&&cfg.key&&window.supabase){
      try{
        this.client=supabase.createClient(cfg.url,cfg.key);
        const{data:{session}}=await this.client.auth.getSession();
        this.user=session?.user||null;
        this.client.auth.onAuthStateChange((_e,s)=>{this.user=s?.user||null;if(this.user)this.schedule(100)});
        this.status=this.user?'已登录':'未登录';
        if(this.user)this.schedule(500);
      }catch(e){this.status='配置错误'}
    }
  },
  async saveConfig(url,key){
    await Meta.set('supabase',{url:url.trim(),key:key.trim()});
    if(window.supabase){this.client=supabase.createClient(url.trim(),key.trim());this.status='未登录';toast('云同步已配置，请登录账号')}
  },
  async register(email,pass){
    if(!this.client)return toast('请先配置云同步');
    const{error}=await this.client.auth.signUp({email,password:pass});
    if(error)return toast('注册失败：'+error.message);
    toast('注册成功！即将登录');
    await this.login(email,pass);
  },
  async login(email,pass){
    if(!this.client)return toast('请先配置云同步');
    const{error}=await this.client.auth.signInWithPassword({email,password:pass});
    if(error)return toast('登录失败：'+(error.message||'邮箱或密码错误'));
    this.user=(await this.client.auth.getUser()).data.user;
    this.status='已登录';
    toast('登录成功，正在同步云端数据...');
    await this.fullSync(true);
    navigate('settings');
  },
  async logout(){
    if(this.client){await this.client.auth.signOut()}
    this.user=null;this.status='未登录';toast('已退出登录');
  },
  async mark(store,id,op){
    await idbPut('sync_queue',{id:store+'/'+id,store,rid:id,op,ts:Date.now()});
    this.schedule();
  },
  schedule(delay=800){
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.fullSync(),delay);
  },
  async fullSync(isLogin=false){
    if(!this.client||!this.user||!navigator.onLine)return;
    this.status='同步中...';
    try{
      /* push 本地变更（云端id = store/本地主键）*/
      let q=(await idbAll('sync_queue')).sort((a,b)=>a.ts-b.ts);
      const latest={};q.forEach(i=>latest[i.id]=i);
      for(const i of Object.values(latest)){
        const row=i.op==='put'?await idbGet(i.store,i.rid):null;
        const cloudId=i.store+'/'+i.rid;
        if(row){
          const{updated_at,...data}=row;
          const{error}=await this.client.from('records').upsert({id:cloudId,store:i.store,data,updated_at:updated_at||getNow(),deleted:false});
          if(error)throw error;
        }else{
          const{error}=await this.client.from('records').upsert({id:cloudId,store:i.store,data:{},deleted:true,updated_at:getNow()});
          if(error)throw error;
        }
        await idbDel('sync_queue',i.id);
      }
      /* pull 云端增量 */
      const since=await Meta.get('lastPull','1970-01-01T00:00:00Z');
      const{data:remote,error:perr}=await this.client.from('records').select('id,store,data,updated_at,deleted').gte('updated_at',since).order('updated_at');
      if(perr)throw perr;
      let changed=0;
      for(const r of(remote||[])){
        if(!STORES[r.store]||r.store==='sync_queue'||r.store==='meta')continue;
        const localKey=r.id.startsWith(r.store+'/')?r.id.slice(r.store.length+1):r.id;
        const local=await idbGet(r.store,localKey);
        const remoteNew=!local||(new Date(r.updated_at)>new Date(local.updated_at||0));
        if(remoteNew){
          if(r.deleted){await idbDel(r.store,localKey)}
          else{
            const row={...r.data};
            if(r.store==='settings')row.key=localKey;else row.id=localKey;
            row.updated_at=r.updated_at;
            await idbPut(r.store,row);
          }
          changed++;
        }
      }
      await Meta.set('lastPull',getNow());
      this.status='已同步';
      if(isLogin&&changed>0){toast(`已从云端恢复 ${changed} 条数据`);renderPage()}
      else if(!isLogin&&changed>0)renderPage();
    }catch(e){this.status='同步失败';console.warn('[Sync]',e)}
  }
};

/* ================= 模块：任务中心 ================= */
M.tasks={
  tab:'today',
  async render(){return`<div class="segmented" id="taskTabs"><button class="seg-item ${this.tab==='today'?'active':''}" onclick="M.tasks.switch('today')">今日清单</button><button class="seg-item ${this.tab==='week'?'active':''}" onclick="M.tasks.switch('week')">本周计划</button><button class="seg-item ${this.tab==='longterm'?'active':''}" onclick="M.tasks.switch('longterm')">长期目标</button></div><div id="taskContent"></div>`},
  async switch(t){this.tab=t;document.querySelectorAll('#taskTabs .seg-item').forEach((b,i)=>b.classList.toggle('active',['today','week','longterm'][i]===t));await this.content()},
  async after(){await this.content()},
  async content(){const c=$('#taskContent');if(!c)return;
    if(this.tab==='today')c.innerHTML=await this.today();
    else if(this.tab==='week')c.innerHTML=await this.week();
    else c.innerHTML=await this.longterm();
  },
  async today(){
    const t=getToday(),tasks=await idbIdx('tasks','date',t);
    tasks.sort((a,b)=>{const p={high:0,medium:1,low:2};return(p[a.priority]??1)-(p[b.priority]??1)||a.completed-b.completed});
    const done=tasks.filter(x=>x.completed).length,total=tasks.length,prog=total?Math.round(done/total*100):0;
    const sug=[['阅读30分钟','学习','medium','📖'],['完成今日工作汇报','工作','high','💼'],['运动30分钟','健康','medium','🏃'],['背10个单词','学习','low','🔤'],['整理桌面','生活','low','🧹'],['规划明日日程','工作','medium','📅'],['复盘今日工作','工作','medium','📝'],['联系一位老朋友','生活','low','📞']].sort(()=>Math.random()-.5).slice(0,3);
    return`
    <div class="card" style="text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-3xl);font-weight:800">${prog}%</div><div style="font-size:var(--font-sm);opacity:.85">${done}/${total} 已完成</div></div>
    ${prog===100&&total?`<button class="btn btn-primary btn-block" style="margin-bottom:12px" onclick="M.tasks.claim()">🪙 领取今日金币奖励 (+2)</button>`:''}
    <div class="card"><div class="card-header"><span class="card-title">➕ 新增任务</span></div>
      <div class="form-group"><input class="input" id="ntText" placeholder="输入任务内容..."></div>
      <div style="display:flex;gap:8px;margin-bottom:10px"><select class="select" id="ntCat" style="flex:1"><option>工作</option><option>学习</option><option>生活</option><option>健康</option><option>其他</option></select><select class="select" id="ntPri" style="flex:1"><option value="high">🔴 高优先级</option><option value="medium" selected>🟡 中优先级</option><option value="low">🟢 低优先级</option></select></div>
      <button class="btn btn-primary btn-block" onclick="M.tasks.addToday()">添加任务</button></div>
    ${!total?`<div class="card"><div class="card-header"><span class="card-title">💡 今日推荐</span><span class="card-subtitle">随机3条</span></div>${sug.map(s=>`<div class="list-item" style="cursor:pointer" onclick="M.tasks.addSug('${esc(s[0])}','${s[1]}','${s[2]}')"><span style="font-size:19px">${s[3]}</span><span style="flex:1;font-size:var(--font-sm)">${s[0]}</span><span class="chip chip-outline" style="font-size:var(--font-xs)">${s[1]}</span><span style="color:var(--primary-dark)">＋</span></div>`).join('')}</div>`:''}
    <div class="card"><div class="card-header"><span class="card-title">📋 任务列表</span></div>
    ${total?tasks.map(x=>`<div class="list-item"><div class="checkbox ${x.completed?'checked':''}" onclick="M.tasks.toggle('${x.id}')"></div><div style="flex:1"><div style="font-size:var(--font-sm);font-weight:500;${x.completed?'text-decoration:line-through;opacity:.5':''}">${esc(x.text)}</div><div style="display:flex;gap:5px;margin-top:3px"><span class="chip chip-outline" style="font-size:var(--font-xs)">${esc(x.category||'其他')}</span>${x.priority==='high'?'<span class="chip" style="background:#FFCDD2;color:#C62828;font-size:var(--font-xs)">高</span>':x.priority==='low'?'<span class="chip" style="background:#C8E6C9;color:#2E7D32;font-size:var(--font-xs)">低</span>':'<span class="chip" style="background:#FFF9C4;color:#F57F17;font-size:var(--font-xs)">中</span>'}</div></div><button onclick="M.tasks.del('${x.id}')" style="border:none;background:transparent;font-size:17px;padding:6px">🗑</button></div>`).join(''):'<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无任务，开始规划今天吧</div></div>'}</div>`;
  },
  async week(){
    const{start,end}=weekRange(),tasks=await idbRange('tasks','date',start,end);
    const days=['周一','周二','周三','周四','周五','周六','周日'],wd=[];const mon=new Date(start);
    for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const ds=fmt(d);wd.push({date:ds,day:days[i],tasks:tasks.filter(t=>t.date===ds)})}
    return`
    <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-lg);font-weight:700">本周计划</div><div style="font-size:var(--font-sm);opacity:.85">${fmt(start,'MM/DD')} - ${fmt(end,'MM/DD')} · 共${tasks.length}项</div></div>
    <div class="card"><div class="card-header"><span class="card-title">➕ 添加本周计划</span></div>
      <div class="form-group"><input class="input" id="wtText" placeholder="计划内容..."></div>
      <div style="display:flex;gap:8px;margin-bottom:10px"><input class="input" type="date" id="wtDate" value="${getToday()}" style="flex:1"><select class="select" id="wtCat" style="flex:1"><option>工作</option><option>学习</option><option>生活</option><option>其他</option></select></div>
      <button class="btn btn-primary btn-block" onclick="M.tasks.addWeek()">添加</button></div>
    ${wd.map(w=>`<div class="card"><div class="card-header"><span class="card-title">${w.day} ${fmt(w.date,'MM/DD')}</span><span class="card-subtitle">${w.tasks.filter(t=>t.completed).length}/${w.tasks.length}</span></div>
      ${w.tasks.length?w.tasks.map(t=>`<div class="list-item"><div class="checkbox ${t.completed?'checked':''}" onclick="M.tasks.toggle('${t.id}')"></div><span style="flex:1;font-size:var(--font-sm);${t.completed?'text-decoration:line-through;opacity:.5':''}">${esc(t.text)}</span><span class="chip chip-outline" style="font-size:var(--font-xs)">${esc(t.category||'')}</span></div>`).join(''):'<div style="font-size:var(--font-xs);color:var(--text-tertiary);padding:6px 0">暂无安排</div>'}</div>`).join('')}`;
  },
  async longterm(){
    const goals=await idbIdx('tasks','type','longterm');
    const avg=goals.length?Math.round(goals.reduce((s,g)=>s+(g.progress||0),0)/goals.length):0;
    return`
    <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-lg);font-weight:700">长期目标</div><div style="display:flex;gap:24px;margin-top:10px"><div><div style="font-size:30px;font-weight:800">${goals.length}</div><div style="font-size:var(--font-xs);opacity:.8">总目标</div></div><div><div style="font-size:30px;font-weight:800">${avg}%</div><div style="font-size:var(--font-xs);opacity:.8">平均进度</div></div><div><div style="font-size:30px;font-weight:800">${goals.filter(g=>(g.progress||0)>=100).length}</div><div style="font-size:var(--font-xs);opacity:.8">已完成</div></div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">🎯 添加长期目标</span></div>
      <div class="form-group"><input class="input" id="ngText" placeholder="目标描述..."></div>
      <div class="form-group"><label class="form-label">初始进度 <span id="gpv">0%</span></label><input type="range" id="ngProg" min="0" max="100" value="0" oninput="document.getElementById('gpv').textContent=this.value+'%'"></div>
      <button class="btn btn-primary btn-block" onclick="M.tasks.addGoal()">添加目标</button></div>
    ${goals.length?goals.map(g=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="flex:1"><div style="font-size:var(--font-md);font-weight:600">${esc(g.text)}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary);margin-top:3px">创建于 ${fmt(g.createdAt||getNow(),'YYYY-MM-DD')}</div></div><button onclick="M.tasks.del('${g.id}')" style="border:none;background:transparent;font-size:17px">🗑</button></div>
      <div style="display:flex;align-items:center;gap:10px"><input type="range" value="${g.progress||0}" min="0" max="100" style="flex:1" oninput="M.tasks.setProg('${g.id}',this.value);document.getElementById('gp_${g.id}').textContent=this.value+'%'"><span id="gp_${g.id}" style="font-weight:700;color:var(--primary-dark);min-width:42px;text-align:right">${g.progress||0}%</span></div>
      ${(g.progress||0)>=100?'<div class="chip" style="margin-top:8px;background:var(--success);color:#fff">🎉 已完成</div>':''}</div>`).join(''):'<div class="card"><div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">设定你的第一个长期目标</div></div></div>'}`;
  },
  async addToday(){const text=$('#ntText').value.trim();if(!text)return toast('请输入任务内容');await DB.put('tasks',{id:genId(),text,category:$('#ntCat').value,priority:$('#ntPri').value,completed:false,date:getToday(),type:'today',createdAt:getNow()});toast('任务已添加');this.content()},
  async addSug(text,cat,pri){await DB.put('tasks',{id:genId(),text,category:cat,priority:pri,completed:false,date:getToday(),type:'today',createdAt:getNow()});toast('已添加');this.content()},
  async addWeek(){const text=$('#wtText').value.trim(),date=$('#wtDate').value;if(!text)return toast('请输入内容');if(!date)return toast('请选择日期');await DB.put('tasks',{id:genId(),text,category:$('#wtCat').value,priority:'medium',completed:false,date,type:'week',createdAt:getNow()});toast('计划已添加');this.content()},
  async addGoal(){const text=$('#ngText').value.trim();if(!text)return toast('请输入目标');const p=+$('#ngProg').value;await DB.put('tasks',{id:genId(),text,progress:p,type:'longterm',completed:p>=100,createdAt:getNow()});toast('目标已添加');this.content()},
  async toggle(id){const t=await idbGet('tasks',id);if(!t)return;t.completed=!t.completed;await DB.put('tasks',t);this.content()},
  async del(id){await DB.delete('tasks',id);toast('已删除');this.content()},
  async setProg(id,p){const g=await idbGet('tasks',id);if(!g)return;g.progress=+p;g.completed=g.progress>=100;await DB.put('tasks',g)},
  async claim(){const t=getToday(),tasks=await idbIdx('tasks','date',t);if(!tasks.length||!tasks.every(x=>x.completed))return toast('还有未完成的任务');
    if(await Settings.get('reward_'+t))return toast('今日已领取');
    if(await Coins.earn(2,'task','今日任务全部完成')){await Settings.set('reward_'+t,true);toast('🪙 +2 金币已领取！');renderPage()}},
};

/* ================= 模块：灵感 ================= */
M.inspiration={
  tag:'all',
  async render(){
    const all=(await idbAll('inspirations')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    const tags=[...new Set(all.flatMap(i=>i.tags||[]))];

      <div class="form-group"><label class="form-label">标签</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px" id="niTags">${['脑洞','感悟','工作','生活','情绪','灵感'].map(t=>`<span class="chip" onclick="this.classList.toggle('active')">${t}</span>`).join('')}</div>
      <input class="input" id="niCustom" placeholder="自定义标签（可选）" style="font-size:var(--font-sm)"></div>

  },

  async save(){const c=$('#niContent').value.trim();if(!c)return toast('请输入内容');

    const ct=$('#niCustom').value.trim();if(ct)tags.push(ct);
    await DB.put('inspirations',{id:genId(),content:c,tags:tags.length?tags:['随笔'],createdAt:getNow()});
    toast('灵感已保存 💡');renderPage()},

};

  async content(){const c=$('#engContent');if(!c)return;const t=getToday(),seed=parseInt(t.split('-').join(''));

      ${tr.length?tr.map(r=>`<div class="list-item"><span style="font-size:19px">${r.platform==='抖音'?'🎵':r.platform==='快手'?'📹':r.platform==='拼多多'?'🛒':r.platform==='淘宝'?'🛍️':r.platform==='外卖'?'🍜':r.platform==='线下'?'🏪':r.type==='income'?'💵':'📦'}</span><div style="flex:1"><div style="font-size:var(--font-sm);font-weight:500">${esc(r.item||r.platform)}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">${esc(r.platform)}${r.note?' · '+esc(r.note):''}</div></div><span style="font-weight:700;color:${r.type==='income'?'var(--success)':'var(--danger)'}">${r.type==='income'?'+':'-'}¥${r.amount}</span><button onclick="M.accounting.del('${r.id}')" style="border:none;background:transparent;color:var(--text-tertiary);font-size:14px;padding:4px">✕</button></div>`).join(''):'<div class="empty-state"><div class="empty-icon">🧾</div><div class="empty-text">今日还没有记账</div></div>'}</div>
    <div class="card"><div class="card-header"><span class="card-title">📊 年度总览</span><select class="select" style="width:auto;font-size:var(--font-xs);padding:4px 8px;min-height:0" onchange="M.accounting.setYear(this.value)">${[this.year-2,this.year-1,this.year].map(y=>`<option value="${y}" ${y===this.year?'selected':''}>${y}年</option>`).join('')}</select></div>
      <canvas id="yearChart" height="200"></canvas><div id="yearSummary" style="margin-top:12px"></div></div>
    <div class="card"><div class="card-header"><span class="card-title">🥧 消费分类占比</span></div><canvas id="catChart" height="220"></canvas></div>`},
  async save(){const date=$('#acDate').value,platform=$('#acPlat').value,amount=parseFloat($('#acAmt').value),item=$('#acItem').value.trim(),note=$('#acNote').value.trim();

  addIncome(){modal('录入今日收入',`<div class="form-group"><label class="form-label">金额</label><input class="input" type="number" id="inAmt" placeholder="0.00" step="0.01"></div><div class="form-group"><label class="form-label">来源</label><input class="input" id="inSrc" placeholder="如：工资、奖金等"></div>`,[{label:'取消'},{label:'保存',class:'btn-primary',onClick:async m=>{const a=parseFloat(m.querySelector('#inAmt').value),s=m.querySelector('#inSrc').value.trim();if(!a||a<=0)return toast('请输入金额');
    await DB.put('accounting',{id:genId(),type:'income',date:getToday(),platform:'收入',amount:a,item:s,note:'',createdAt:getNow()});toast('收入已记录');renderPage()}}])},
  cfg(){modal('预算设置',`<div class="form-group"><label class="form-label">本月消费预算</label><input class="input" type="number" id="cfgB" value="5000"></div><div class="form-group"><label class="form-label">本月总收入</label><input class="input" type="number" id="cfgI" value="0"></div>`,[{label:'取消'},{label:'保存',class:'btn-primary',onClick:async m=>{await Settings.set('acc_cfg',{budget:parseFloat(m.querySelector('#cfgB').value)||5000,income:parseFloat(m.querySelector('#cfgI').value)||0});toast('已保存');renderPage()}}])},
  async del(id){await DB.delete('accounting',id);toast('已删除');renderPage()},
  setYear(y){this.year=+y;this.charts()},
  async charts(){
    if(typeof Chart==='undefined')return;
    const yr=yearRange(this.year),rs=await idbRange('accounting','date',yr.start,yr.end);
    const months=Array(12).fill(0).map(()=>({i:0,e:0}));
    rs.forEach(r=>{const m=parseInt(r.date.slice(5,7))-1;if(m>=0&&m<12){if(r.type==='income')months[m].i+=r.amount;else months[m].e+=r.amount}});
    const ti=months.reduce((s,m)=>s+m.i,0),te=months.reduce((s,m)=>s+m.e,0),bal=ti-te;
    const ys=$('#yearSummary');
    if(ys)ys.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center"><div style="background:var(--bg-hover);padding:8px;border-radius:8px"><div style="font-size:var(--font-xs);color:var(--text-tertiary)">年度收入</div><div style="font-weight:700;color:var(--success)">¥${ti.toFixed(0)}</div></div><div style="background:var(--bg-hover);padding:8px;border-radius:8px"><div style="font-size:var(--font-xs);color:var(--text-tertiary)">年度支出</div><div style="font-weight:700;color:var(--danger)">¥${te.toFixed(0)}</div></div><div style="background:var(--bg-hover);padding:8px;border-radius:8px"><div style="font-size:var(--font-xs);color:var(--text-tertiary)">结余</div><div style="font-weight:700;color:${bal>=0?'var(--primary-dark)':'var(--danger)'}">¥${bal.toFixed(0)}</div></div></div>`;
    const yc=$('#yearChart');
    if(yc){window._yc?.destroy();window._yc=new Chart(yc,{type:'bar',data:{labels:[...Array(12)].map((_,i)=>(i+1)+'月'),datasets:[{label:'收入',data:months.map(m=>m.i),backgroundColor:'#4CAF50'},{label:'支出',data:months.map(m=>m.e),backgroundColor:'#F44336'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}})}
    const cc=$('#catChart');
    if(cc){const cats={};rs.filter(r=>r.type==='expense').forEach(r=>cats[r.platform]=(cats[r.platform]||0)+r.amount);
      const L=Object.keys(cats),D=Object.values(cats),C=['#8BC34A','#FF9800','#2196F3','#9C27B0','#F44336','#00BCD4','#795548'];
      window._cc?.destroy();window._cc=new Chart(cc,{type:'doughnut',data:{labels:L.length?L:['暂无数据'],datasets:[{data:D.length?D:[1],backgroundColor:C}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:8}}}}})}},
  async after(){await this.charts()},
};

  async calcRecipe(){const h=+$('#bH').value,w=+$('#bW').value,a=+$('#bA').value,g=$('#bG').value,budget=+$('#bB').value||50;
    if(!h||!w||!a)return toast('请填写完整数据');
    await DB.put('body_data',{id:genId(),height:h,weight:w,age:a,gender:g,budget,date:getToday(),createdAt:getNow()});
    const bmi=w/Math.pow(h/100,2);
    const cat=bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖';
    const bmr=g==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
    const tdee=Math.round(bmr*1.4);
    const B=[['燕麦牛奶+鸡蛋',350,8],['全麦面包+豆浆',300,6],['小米粥+水煮蛋',280,5]];
    const L=[['鸡胸肉沙拉+糙米饭',500,18],['番茄牛肉面+蔬菜',480,15],['清蒸鱼+西兰花+米饭',450,20]];

    const S=[['苹果+酸奶',150,5],['坚果一小把',180,4],['香蕉+牛奶',160,4]];
    const days=['第一天','第二天','第三天'];let cost=0;
    const rs=days.map((d,i)=>{const b=B[i%3],l=L[i%3],dd=D[i%3],s=S[i%3];const c=b[2]+l[2]+dd[2]+s[2];cost+=c;return{d,b,l,dd,s,cal:b[1]+l[1]+dd[1]+s[1],c}});
    const over=cost>budget*3;
    $('#recipeResult').innerHTML=`
    <div class="card"><div class="card-header"><span class="card-title">📊 身体分析</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:var(--bg-hover);padding:10px;border-radius:12px;text-align:center"><div style="font-size:var(--font-xl);font-weight:800;color:${bmi>24?'var(--danger)':bmi<18.5?'var(--warning)':'var(--success)'}">${bmi.toFixed(1)}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">BMI · ${cat}</div></div><div style="background:var(--bg-hover);padding:10px;border-radius:12px;text-align:center"><div style="font-size:var(--font-xl);font-weight:800;color:var(--primary-dark)">${tdee}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">TDEE 每日消耗</div></div></div></div>
    ${rs.map(r=>`<div class="card"><div class="card-header"><span class="card-title">${r.d}</span><span class="card-subtitle">共${r.cal}kcal · ¥${r.c}</span></div>

    ${over?`<div class="card" style="background:#FFEBEE;border-color:var(--danger)"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:22px">⚠️</span><div><div style="font-weight:700;color:var(--danger)">超出预算！</div><div style="font-size:var(--font-xs);color:#B71C1C">3天总花费 ¥${cost}，超出预算 ¥${cost-budget*3}</div></div></div></div>`:`<div class="card" style="background:var(--primary-light);border-color:var(--primary)"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:22px">✅</span><div><div style="font-weight:700;color:var(--primary-dark)">预算内！</div><div style="font-size:var(--font-xs);color:var(--primary-dark)">3天总花费 ¥${cost}，预算 ¥${budget*3}</div></div></div></div>`}`},

        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:14px;width:100%" onclick="M.health.addVideo()">＋ 添加</button>
    </div>
    <div class="card"><div class="card-header"><span class="card-title">📚 跟练视频库</span><span class="card-subtitle">共 ${list.length} 个</span></div>${listHTML}</div>`},
  toggleCustomCat(sel){const el=$('#vCustomCat');if(!el)return;el.style.display=sel.value==='__other__'?'block':'none';if(sel.value!=='__other__')el.value=''},
  async addVideo(){
    const name=$('#vName').value.trim(),url=$('#vUrl').value.trim(),dur=+$('#vDur').value,catSel=$('#vCat').value;
    if(!name||!url||!dur)return toast('请填写名称、链接和时长');
    let category=catSel;
    if(catSel==='__other__'){category=$('#vCustomCat').value.trim()||'其他';if(category==='其他')return toast('请输入自定义类别')}
    await DB.put('exercises',{id:genId(),type:'video',name,url,duration:dur,category,date:getToday(),createdAt:getNow()});
    toast('已添加 ✨');
    $('#vName').value='';$('#vUrl').value='';$('#vDur').value='';$('#vCat').value='有氧';this.toggleCustomCat($('#vCat'));
    renderPage();
  },
  async delVideo(id){await DB.delete('exercises',id);toast('已删除');renderPage()},
  async openVideo(url,id){
    if(!url)return toast('该视频没有链接');
    window.open(url,'_blank','noopener');
    // 自动打卡 +2 金币（当日每个视频限一次）
    if(!id)return;
    const t=getToday();
    const already=await idbIdx('checkins','date',t);
    if(already.some(c=>c.skill==='视频跟练'&&c.note===id))return;
    await DB.put('checkins',{id:genId(),skill:'视频跟练',date:t,note:id,createdAt:getNow()});
    if(await Coins.earn(2,'video','视频跟练打卡'))toast('🪙 +2 金币！');
  },
  /* --- 体温 --- */
  async tempPage(){const t=getToday();
    const all=(await idbAll('temperature')).sort((a,b)=>a.date.localeCompare(b.date));
    const avg=all.length?(all.reduce((s,r)=>s+r.value,0)/all.length):36.5;
    const anomalies=this.detect(all,avg);
    const todayRec=(await idbIdx('temperature','date',t))[0];
    return`<div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-lg);font-weight:700">🌡️ 体温记录</div><div style="font-size:var(--font-sm);opacity:.85;margin-top:4px">趋势监控 · 异常预警 · 就医提醒</div></div>
    <div class="card" style="display:flex;gap:14px;text-align:center">
      <div style="flex:1"><div style="font-size:var(--font-xl);font-weight:800;color:${todayRec&&todayRec.value>37.3?'var(--danger)':'var(--primary-dark)'}">${todayRec?todayRec.value:'--'}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">今日体温℃</div></div>
      <div style="flex:1"><div style="font-size:var(--font-xl);font-weight:800;color:var(--primary-dark)">${avg.toFixed(2)}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">个人均值℃</div></div>
      <div style="flex:1"><div style="font-size:var(--font-xl);font-weight:800;color:${anomalies.length?'var(--danger)':'var(--success)'}">${anomalies.length}</div><div style="font-size:var(--font-xs);color:var(--text-tertiary)">异常标记</div></div></div>
    <div class="card"><div class="card-header"><span class="card-title">📝 录入体温</span></div>
      <div style="display:flex;gap:8px;margin-bottom:10px"><div style="flex:1"><label class="form-label">日期</label><input class="input" type="date" id="tpDate" value="${t}"></div><div style="flex:1"><label class="form-label">时间</label><input class="input" type="time" id="tpTime" value="${fmt(new Date(),'HH:mm')}"></div></div>
      <div class="form-group"><label class="form-label">体温 ℃</label><input class="input" type="number" id="tpVal" placeholder="36.50" step="0.01" min="35" max="42"></div>
      <div class="form-group"><input class="input" id="tpNote" placeholder="备注（可选）"></div>
      <button class="btn btn-primary btn-block" onclick="M.health.addTemp()">记录体温</button></div>
    ${all.length?`<div class="card"><div class="card-header"><span class="card-title">📈 体温趋势图</span><span class="card-subtitle">均值 ${avg.toFixed(2)}℃</span></div><canvas id="tempChart" height="200"></canvas></div>`:''}
    ${anomalies.length?`<div class="card" style="background:#FFEBEE;border-color:var(--danger)"><div class="card-header"><span class="card-title" style="color:var(--danger)">⚠️ 体温异常标记</span></div>
      ${anomalies.map(a=>`<div style="padding:8px 0;border-bottom:1px solid rgba(244,67,54,.15)"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:var(--font-sm);font-weight:600;color:var(--danger)">🔥 ${fmt(a.date,'YYYY年MM月DD日')}</div><div style="font-size:var(--font-xs);color:#B71C1C">体温 ${a.value}℃（高于均值 ${(a.value-avg).toFixed(1)}℃，次日已回落）</div></div><button class="btn btn-sm btn-outline" onclick="M.health.editAnomaly('${a.id}')">修改日期</button></div>
      ${a.medicalReminder?`<div style="margin-top:6px;padding:6px 10px;background:#fff;border-radius:8px;font-size:var(--font-xs);color:#B71C1C">🏥 建议就医日：${fmt(a.medicalReminder,'YYYY年MM月DD日')}</div>`:''}</div>`).join('')}</div>`:''}
    ${all.length?`<div class="card"><div class="card-header"><span class="card-title">📜 历史记录</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="tpFilter"><span class="chip active" onclick="M.health.fMonth('')">全部</span>${[...new Set(all.map(r=>r.date.slice(0,7)))].map(mm=>`<span class="chip" onclick="M.health.fMonth('${mm}')">${mm}</span>`).join('')}</div>
      <div id="tpList">${[...all].reverse().map(r=>`<div class="list-item" data-m="${r.date.slice(0,7)}"><span style="font-size:15px;${r.value>avg+0.5?'color:var(--danger)':''}">🌡️</span><div style="flex:1"><span style="font-size:var(--font-sm);font-weight:600">${r.value}℃</span><span style="font-size:var(--font-xs);color:var(--text-tertiary);margin-left:8px">${fmt(r.date,'MM/DD')} ${r.time||''}</span>${r.note?`<div style="font-size:var(--font-xs);color:var(--text-tertiary)">${esc(r.note)}</div>`:''}</div><button onclick="M.health.delTemp('${r.id}')" style="border:none;background:transparent;font-size:13px;color:var(--text-tertiary)">✕</button></div>`).join('')}</div></div>`:''}`},
  detect(records,avg){const th=avg+0.5;const out=[];
    for(let i=0;i<records.length-1;i++){const cur=records[i],nxt=records[i+1];
      if(cur.value>=th&&nxt.value<=avg+0.3){
        if(!cur.anomaly){cur.anomaly=true;const rd=new Date(cur.date);rd.setDate(rd.getDate()+10);cur.medicalReminder=fmt(rd);DB.put('temperature',cur)}
        out.push(cur)}}
    return out},
  async addTemp(){const date=$('#tpDate').value,time=$('#tpTime').value,value=parseFloat($('#tpVal').value),note=$('#tpNote').value.trim();
    if(!date||!value)return toast('请填写日期和体温');if(value<35||value>42)return toast('体温范围异常');
    await DB.put('temperature',{id:genId(),date,time,value,note,anomaly:false,createdAt:getNow()});toast('体温已记录');renderPage()},
  async delTemp(id){await DB.delete('temperature',id);toast('已删除');renderPage()},
  editAnomaly(id){idbGet('temperature',id).then(r=>{if(!r)return;
    modal('修改升温标记日期',`<div class="form-group"><label class="form-label">升温日期</label><input class="input" type="date" id="anDate" value="${r.date}"></div><p style="font-size:var(--font-xs);color:var(--text-tertiary)">修改后就医提醒日将自动更新为该日期后第10天</p>`,[{label:'取消'},{label:'保存',class:'btn-primary',onClick:async m=>{const nd=m.querySelector('#anDate').value;r.date=nd;const rd=new Date(nd);rd.setDate(rd.getDate()+10);r.medicalReminder=fmt(rd);await DB.put('temperature',r);toast('已更新');renderPage()}}])})},
  fMonth(m){document.querySelectorAll('#tpFilter .chip').forEach(c=>c.classList.remove('active'));event.target.classList.add('active');
    document.querySelectorAll('#tpList .list-item').forEach(it=>it.style.display=(!m||it.dataset.m===m)?'':'none')},
  async after(sub){if(sub==='temperature'&&typeof Chart!=='undefined'){const rs=(await idbAll('temperature')).sort((a,b)=>a.date.localeCompare(b.date));
    const cv=$('#tempChart');
    if(cv&&rs.length){const avg=rs.reduce((s,r)=>s+r.value,0)/rs.length;
      window._tc?.destroy();
      window._tc=new Chart(cv,{type:'line',data:{labels:rs.map(r=>fmt(r.date,'MM/DD')),datasets:[{label:'体温℃',data:rs.map(r=>r.value),borderColor:'#F44336',backgroundColor:'rgba(244,67,54,.1)',fill:true,tension:.3},{label:'均值',data:rs.map(()=>avg),borderColor:'#8BC34A',borderDash:[5,5],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11}}}},scales:{y:{min:35.5,max:38.5,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}})}}},
};

/* ================= 模块：设置（云同步+账号）================= */
M.settings={
  async render(){const theme=await Settings.get('theme','apple');
    const cfg=await Meta.get('supabase',{});
    const lastSync=await Meta.get('lastPull',null);
    const custom=theme.startsWith('custom:')?theme.slice(7):null;
    return`
    <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-lg);font-weight:700">⚙️ 设置</div><div style="font-size:var(--font-sm);opacity:.85;margin-top:4px">主题 · 账号 · 云同步</div></div>
    <div class="card"><div class="card-header"><span class="card-title">🎨 主题配色</span></div>
      <p style="font-size:var(--font-xs);color:var(--text-tertiary);margin-bottom:4px">默认青苹果绿，点击切换</p>
      <div class="theme-swatches">${Object.entries(THEMES).map(([k,v])=>`<div class="color-swatch ${theme===k?'active':''}" style="background:${v[0]}" onclick="applyTheme('${k}');renderPage()"></div>`).join('')}</div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px"><span style="font-size:var(--font-sm)">自定义：</span><input type="color" value="${custom||'#8BC34A'}" onchange="applyCustom(this.value)" style="width:52px;height:40px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:transparent"></div></div>
    <div class="card"><div class="card-header"><span class="card-title">☁️ 云同步（Supabase）</span><span class="sync-status">${Sync.client?(Sync.user?'✅ '+Sync.status:'未登录'):navigator.onLine?'未配置':'离线'}</span></div>
      ${Sync.user?`
        <div style="background:var(--bg-hover);border-radius:12px;padding:12px;margin-bottom:10px"><div style="font-size:var(--font-sm)"><b>当前账号：</b>${esc(Sync.user.email||'')}</div>${lastSync?`<div style="font-size:var(--font-xs);color:var(--text-tertiary);margin-top:4px">上次同步：${fmt(lastSync,'MM-DD HH:mm')}</div>`:''}</div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="Sync.fullSync().then(()=>{toast('同步完成');renderPage()})">立即同步</button><button class="btn btn-outline" style="flex:1" onclick="Sync.logout().then(()=>renderPage())">退出登录</button></div>
        <p style="font-size:var(--font-xs);color:var(--text-tertiary);margin-top:10px;line-height:1.6">换设备登录同一账号即可读取全部历史数据；本地数据自动上传云端。</p>`
      :`
        <p style="font-size:var(--font-xs);color:var(--text-tertiary);margin-bottom:10px;line-height:1.6">配置后可跨设备同步。先在 supabase.com 创建免费项目（教程见下方），再把 URL 和 Key 填到这里。</p>
        <div class="form-group"><label class="form-label">Project URL</label><input class="input" id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url||'')}"></div>
        <div class="form-group"><label class="form-label">anon public key</label><input class="input" id="sbKey" placeholder="eyJhbGciOi..." value="${esc(cfg.key||'')}"></div>
        <button class="btn btn-secondary btn-block" style="margin-bottom:12px" onclick="M.settings.saveCfg()">保存云配置</button>
        <div class="form-group"><label class="form-label">邮箱</label><input class="input" type="email" id="lgEmail" placeholder="you@example.com"></div>
        <div class="form-group"><label class="form-label">密码（至少6位）</label><input class="input" type="password" id="lgPass" placeholder="••••••"></div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="M.settings.login()">登录</button><button class="btn btn-outline" style="flex:1" onclick="M.settings.register()">注册新账号</button></div>`}
    </div>
    <div class="card"><div class="card-header"><span class="card-title">🧑‍💼 个性化</span></div>
      <div class="form-group"><label class="form-label">问候语（启动页展示）</label><input class="input" id="stGreet" placeholder="嗨，岑甜甜🧸" value="${esc(await Settings.get('greeting','嗨，岑甜甜🧸'))}"></div>
      <div class="form-group"><label class="form-label">每日金币上限</label><input class="input" type="number" id="stCoins" value="${await Settings.get('maxDailyCoins',10)}"></div>
      <button class="btn btn-primary btn-block" onclick="M.settings.save()">保存设置</button></div>
    <div class="card"><div class="card-header"><span class="card-title">📚 部署与使用教程</span></div>
      <button class="btn btn-secondary btn-block" onclick="navigate('guide')">查看手机部署教程</button></div>
    <div class="card" style="text-align:center"><p style="font-size:var(--font-xs);color:var(--text-tertiary)">个人工作台 PWA v2.0</p><p style="font-size:var(--font-xs);color:var(--text-tertiary);margin-top:4px">离线可用 · 云端同步 · 跨设备</p></div>`},
  async saveCfg(){const u=$('#sbUrl').value.trim(),k=$('#sbKey').value.trim();if(!u||!k)return toast('请填写完整');
    if(!window.supabase)return toast('SDK未加载，请联网后重试');
    await Sync.saveConfig(u,k);renderPage()},
  login(){const e=$('#lgEmail').value.trim(),p=$('#lgPass').value;if(!e||!p)return toast('请输入邮箱和密码');Sync.login(e,p)},
  register(){const e=$('#lgEmail').value.trim(),p=$('#lgPass').value;if(!e||!p)return toast('请输入邮箱和密码');if(p.length<6)return toast('密码至少6位');Sync.register(e,p)},
  async save(){const g=$('#stGreet').value.trim();if(g)await Settings.set('greeting',g);await Settings.set('maxDailyCoins',+$('#stCoins').value||10);toast('设置已保存')},
  async after(){},
};

/* ================= 模块：部署教程 ================= */
M.guide={
  render(){return`
  <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none"><div style="font-size:var(--font-lg);font-weight:700">📚 手机部署教程</div><div style="font-size:var(--font-sm);opacity:.85;margin-top:4px">全程只用手机浏览器即可完成</div></div>
  <div class="guide-step"><h4>第一步：注册 GitHub（网页托管）</h4><p>手机浏览器打开 <code>github.com/signup</code>，邮箱注册并登录。</p></div>
  <div class="guide-step"><h4>第二步：创建仓库并上传3个文件</h4><p>登录后点右上角 <code>＋</code> → <code>New repository</code>，名字填 <code>workbench</code>，选 Public，点 <code>Create repository</code>。</p><p>在仓库页点 <code>Add file</code> → <code>Create new file</code>，文件名分别输入 <code>index.html</code>、<code>manifest.json</code>、<code>sw.js</code>，把对应的完整代码粘贴进去（从部署助手页面复制），每次粘贴后点 <code>Commit changes</code>。</p><p>💡 若手机粘贴卡顿：用 Chrome 打开 github.com，菜单里勾选「桌面版网站」再操作。</p></div>
  <div class="guide-step"><h4>第三步：开启 GitHub Pages（获得永久链接）</h4><p>仓库页 <code>Settings</code> → <code>Pages</code> → Source 选 <code>Deploy from a branch</code>，分支选 <code>main</code>、目录 <code>/ (root)</code> → <code>Save</code>。等1~2分钟，刷新后顶部出现 <code>https://你的用户名.github.io/workbench/</code> —— 这就是永久访问地址。</p></div>
  <div class="guide-step"><h4>第四步：创建云端数据库（Supabase）</h4><p>手机浏览器打开 <code>supabase.com</code>，用邮箱注册 → <code>New project</code>（起名 workbench，设一个数据库密码，区域选 Singapore）。</p><p>左侧 <code>SQL Editor</code> → <code>New query</code>，粘贴下方建表SQL，点 <code>Run</code>：</p>
  <textarea class="sql-box" readonly onclick="this.select()">create table if not exists records (
  id text primary key,
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  store text not null,
  data jsonb not null default '{}'::jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now()
);
alter table records enable row level security;
create policy "own rows" on records for all
  using (auth.uid() = user_id)
  with check (auth.uid() = user_id);
create index if not exists records_user_idx on records(user_id, updated_at);</textarea>
  <p style="margin-top:8px">再到 <code>Authentication</code> → <code>Providers</code> → <code>Email</code>，把 <code>Confirm email</code> 开关<b>关闭</b>（免收验证邮件）。</p></div>
  <div class="guide-step"><h4>第五步：在PWA里绑定云账号</h4><p>回到工作台 → 生活 → 设置 → 云同步：<br>① 把 Supabase 的 <code>Project URL</code> 和 <code>anon key</code>（在 Supabase 的 <code>Project Settings → API</code> 里复制）填入并保存；<br>② 输入邮箱密码点「注册新账号」；<br>③ 完成！此后手机、电脑登录同一账号，数据自动双向同步。</p></div>
  <div class="guide-step"><h4>第六步：添加到手机桌面</h4><p>用浏览器打开你的永久链接 → 浏览器菜单 →「添加到主屏幕」→ 桌面出现「工作台」图标，点击全屏使用。</p></div>
  <div class="guide-step"><h4>💡 数据说明</h4><ul><li>所有录入先存手机本地，联网自动上传云端</li><li>换新设备：打开链接 → 登录同一账号 → 全部历史数据自动恢复</li><li>资讯/新闻类内容联网刷新，其余功能全部离线可用</li></ul></div>`},
};

/* ================= 初始化 ================= */
window.navigate=navigate;window.toggleQM=toggleQM;window.quickInsp=quickInsp;window.applyTheme=applyTheme;window.applyCustom=applyCustom;window.Sync=Sync;window.M=M;window.Splash=Splash;window.renderPage=renderPage;
addEventListener('online',()=>{toast('已联网，正在同步...');if(Sync.user)Sync.schedule(300)});
addEventListener('offline',()=>toast('已离线，数据保存在本地'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Sync.user&&navigator.onLine)Sync.schedule(500)});
setInterval(()=>{if(Sync.user&&navigator.onLine)Sync.fullSync()},60000);
async function initApp(){
  const th=await Settings.get('theme','apple');
  th.startsWith('custom:')?applyCustom(th.slice(7)):applyTheme(th);
  if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js')}catch(e){console.warn(e)}}
  await Sync.init();
  await Splash.show();
  const p=new URLSearchParams(location.search).get('page');
  currentPage=p&&PAGES[p]?p:'dashboard';
  renderPage();
}
document.addEventListener('DOMContentLoaded',initApp);
</script>
